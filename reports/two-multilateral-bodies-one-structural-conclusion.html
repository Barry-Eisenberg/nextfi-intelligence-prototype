document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

u002Fstyle>\n<\u002Fhelmet>\n\n<x-import component-from-global-scope=\"deck-stage\" from=\"cccc709f-888e-4406-ad7c-1dc29623fd44#/deck-stage.js\" width=\"1080\" height=\"1350\" hint-size=\"100%,100%\">\n\n  <!-- 1 · COVER -->\n  <section data-label=\"Cover\" data-speaker-notes=\"Hook slide. Hybrid FMI is the destination — the durable endpoint, not a transition.\" style=\"width:1080px;height:1350px;background:radial-gradient(120% 90% at 82% 8%, #123255 0%, #0a1f3d 46%, #071627 100%);font-family:'Plus Jakarta Sans',sans-serif;color:#eaf1fb;padding:88px 84px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;box-sizing:border-box;\">\n    <img src=\"dc933662-fb97-4302-9b80-2f1c5f8697cb\" alt=\"\" style=\"position:absolute;right:-190px;bottom:-170px;width:720px;opacity:0.06;pointer-events:none;\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n      <img src=\"f9631005-fd63-4af3-b703-8f71b995cd6a\" alt=\"NextFi Advisors\" style=\"height:46px;\">\n      <span style=\"font-size:19px;font-weight:600;letter-spacing:2.5px;color:#7dd3fc;text-transform:uppercase;\">Intelligence Brief<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"position:relative;z-index:1;\">\n      <div style=\"width:64px;height:5px;background:#38bdf8;border-radius:3px;margin-bottom:34px;\"><\u002Fdiv>\n      <div style=\"font-size:22px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#7dd3fc;margin-bottom:26px;\">Financial Markets Infrastructure<\u002Fdiv>\n      <h1 style=\"font-size:104px;line-height:0.98;font-weight:800;letter-spacing:-3px;margin:0 0 30px;color:#ffffff;text-wrap:balance;\">Hybrid FMI<br>Is the<br>Destination<\u002Fh1>\n      <p style=\"font-size:32px;line-height:1.4;font-weight:500;color:#b6c9e2;max-width:820px;margin:0;\">What the IMF and OECD tell institutions about tokenization's real trajectory.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:flex-end;justify-content:space-between;position:relative;z-index:1;\">\n      <span style=\"font-size:22px;font-weight:600;color:#8fa6c4;\">July 2026<\u002Fspan>\n      <span style=\"font-size:24px;font-weight:700;color:#38bdf8;display:flex;align-items:center;gap:12px;\">Swipe to read <span style=\"font-size:30px;\">→<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 2 · THE CONVERGENCE -->\n  <section data-label=\"Convergence\" data-speaker-notes=\"IMF from the supply side, OECD from the demand side — independently reach the same conclusion.\" style=\"width:1080px;height:1350px;background:#f4f7fb;font-family:'Plus Jakarta Sans',sans-serif;color:#0f172a;padding:88px 84px;display:flex;flex-direction:column;position:relative;overflow:hidden;box-sizing:border-box;\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:56px;\">\n      <img src=\"fc179b3d-50f7-4d14-9504-bd3b697f2139\" alt=\"NextFi Advisors\" style=\"height:38px;\">\n      <span style=\"font-size:19px;font-weight:700;color:#94a3b8;letter-spacing:1px;\">02 / 14<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-size:22px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:#0369a1;margin-bottom:22px;\">The Convergence<\u002Fdiv>\n    <h2 style=\"font-size:66px;line-height:1.04;font-weight:800;letter-spacing:-2px;margin:0 0 56px;color:#0a1f3d;text-wrap:balance;\">Two multilateral bodies. One structural conclusion.<\u002Fh2>\n    <div style=\"display:flex;flex-direction:column;gap:28px;flex:1;\">\n      <div style=\"background:#ffffff;border:1px solid #e2e8f0;border-left:7px solid #0369a1;border-radius:16px;padding:38px 42px;box-shadow:0 12px 30px rgba(10,31,61,0.05);\">\n        <div style=\"font-size:26px;font-weight:800;color:#0a1f3d;margin-bottom:6px;\">IMF · WP/26/136<\u002Fdiv>\n        <div style=\"font-size:20px;font-weight:600;color:#0369a1;margin-bottom:14px;letter-spacing:0.5px;\">SUPPLY SIDE<\u002Fdiv>\n        <p style=\"font-size:27px;line-height:1.45;color:#475569;margin:0;\">Which FMI functions can migrate on-chain — and which cannot.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#ffffff;border:1px solid #e2e8f0;border-left:7px solid #0369a1;border-radius:16px;padding:38px 42px;box-shadow:0 12px 30px rgba(10,31,61,0.05);\">\n        <div style=\"font-size:26px;font-weight:800;color:#0a1f3d;margin-bottom:6px;\">OECD · Policy Papers No. 75<\u002Fdiv>\n        <div style=\"font-size:20px;font-weight:600;color:#0369a1;margin-bottom:14px;letter-spacing:0.5px;\">DEMAND SIDE<\u002Fdiv>\n        <p style=\"font-size:27px;line-height:1.45;color:#475569;margin:0;\">Why tokenized markets have not yet scaled.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:44px;background:#0a1f3d;border-radius:16px;padding:34px 40px;\">\n      <p style=\"font-size:27px;line-height:1.4;font-weight:700;color:#ffffff;margin:0 0 12px;\">Both conclude: tokenization <span style=\"color:#7dd3fc;\">reconfigures<\u002Fspan> financial market infrastructure — it does not eliminate it.<\u002Fp>\n      <p style=\"font-size:19px;line-height:1.5;font-weight:500;color:#b6c9e2;margin:0;\">Smart contracts absorb record-keeping, settlement, collateral and reporting. They cannot absorb legal certainty, governance, oversight or judgment.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 3 · THE CONSENSUS -->\n  <section data-label=\"Consensus\" data-speaker-notes=\"Three foundational findings both papers share.\" style=\"width:1080px;height:1350px;background:radial-gradient(120% 80% at 15% 12%, #123255 0%, #0a1f3d 50%, #071627 100%);font-family:'Plus Jakarta Sans',sans-serif;color:#eaf1fb;padding:88px 84px;display:flex;flex-direction:column;position:relative;overflow:hidden;box-sizing:border-box;\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:56px;\">\n      <img src=\"f9631005-fd63-4af3-b703-8f71b995cd6a\" alt=\"NextFi Advisors\" style=\"height:38px;\">\n      <span style=\"font-size:19px;font-weight:700;color:#5f7796;letter-spacing:1px;\">03 / 14<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-size:22px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:#7dd3fc;margin-bottom:22px;\">The Multilateral Consensus<\u002Fdiv>\n    <h2 style=\"font-size:62px;line-height:1.05;font-weight:800;letter-spacing:-2px;margin:0 0 60px;color:#ffffff;text-wrap:balance;\">Three findings both papers share.<\u002Fh2>\n    <div style=\"display:flex;flex-direction:column;gap:40px;flex:1;\">\n      <div style=\"display:flex;gap:30px;align-items:flex-start;\">\n        <span style=\"font-size:52px;font-weight:800;color:#38bdf8;line-height:1;min-width:56px;\">01<\u002Fspan>\n        <p style=\"font-size:31px;line-height:1.38;color:#dbe6f4;margin:0;\"><strong style=\"color:#ffffff;\">Hybrid FMI is the structural outcome<\u002Fstrong> — the durable endpoint, not a transition.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"height:1px;background:rgba(125,211,252,0.16);\"><\u002Fdiv>\n      <div style=\"display:flex;gap:30px;align-items:flex-start;\">\n        <span style=\"font-size:52px;font-weight:800;color:#38bdf8;line-height:1;min-width:56px;\">02<\u002Fspan>\n        <p style=\"font-size:31px;line-height:1.38;color:#dbe6f4;margin:0;\"><strong style=\"color:#ffffff;\">Settlement asset interoperability<\u002Fstrong> is the critical near-term constraint.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"height:1px;background:rgba(125,211,252,0.16);\"><\u002Fdiv>\n      <div style=\"display:flex;gap:30px;align-items:flex-start;\">\n        <span style=\"font-size:52px;font-weight:800;color:#38bdf8;line-height:1;min-width:56px;\">03<\u002Fspan>\n        <p style=\"font-size:31px;line-height:1.38;color:#dbe6f4;margin:0;\"><strong style=\"color:#ffffff;\">Regulatory fragmentation<\u002Fstrong> is suppressing adoption more than technology readiness.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 4 · MIGRATES VS STAYS -->\n  <section data-label=\"On-chain vs institutional\" data-speaker-notes=\"Code absorbs the mechanical functions. Judgment, law and oversight remain institutional.\" style=\"width:1080px;height:1350px;background:#f4f7fb;font-family:'Plus Jakarta Sans',sans-serif;color:#0f172a;padding:88px 84px;display:flex;flex-direction:column;position:relative;overflow:hidden;box-sizing:border-box;\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:56px;\">\n      <img src=\"fc179b3d-50f7-4d14-9504-bd3b697f2139\" alt=\"NextFi Advisors\" style=\"height:38px;\">\n      <span style=\"font-size:19px;font-weight:700;color:#94a3b8;letter-spacing:1px;\">04 / 14<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-size:22px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:#0369a1;margin-bottom:22px;\">The Dividing Line<\u002Fdiv>\n    <h2 style=\"font-size:62px;line-height:1.05;font-weight:800;letter-spacing:-2px;margin:0 0 52px;color:#0a1f3d;text-wrap:balance;\">What code absorbs — and what stays institutional.<\u002Fh2>\n    <div style=\"display:flex;flex-direction:column;gap:26px;flex:1;\">\n      <div style=\"background:#ffffff;border:1px solid #e2e8f0;border-radius:18px;padding:38px 42px;\">\n        <div style=\"font-size:23px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#0f9d6a;margin-bottom:24px;\">Migrates on-chain<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:16px;\">\n          <div style=\"display:flex;align-items:center;gap:16px;font-size:28px;font-weight:600;color:#1e293b;\"><span style=\"color:#0f9d6a;font-size:26px;font-weight:800;\">✓<\u002Fspan>Record-keeping<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:16px;font-size:28px;font-weight:600;color:#1e293b;\"><span style=\"color:#0f9d6a;font-size:26px;font-weight:800;\">✓<\u002Fspan>Settlement finality<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:16px;font-size:28px;font-weight:600;color:#1e293b;\"><span style=\"color:#0f9d6a;font-size:26px;font-weight:800;\">✓<\u002Fspan>Collateral management<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:16px;font-size:28px;font-weight:600;color:#1e293b;\"><span style=\"color:#0f9d6a;font-size:26px;font-weight:800;\">✓<\u002Fspan>Reporting &amp; surveillance<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#0a1f3d;border-radius:18px;padding:38px 42px;\">\n        <div style=\"font-size:23px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#7dd3fc;margin-bottom:24px;\">Remains institutional<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:16px;\">\n          <div style=\"display:flex;align-items:center;gap:16px;font-size:28px;font-weight:600;color:#eaf1fb;\"><span style=\"color:#7dd3fc;font-size:24px;\">◆<\u002Fspan>Governance &amp; discretion<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:16px;font-size:28px;font-weight:600;color:#eaf1fb;\"><span style=\"color:#7dd3fc;font-size:24px;\">◆<\u002Fspan>Legal enforceability<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:16px;font-size:28px;font-weight:600;color:#eaf1fb;\"><span style=\"color:#7dd3fc;font-size:24px;\">◆<\u002Fspan>Systemic oversight<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:20px;line-height:1.45;color:#64748b;margin:32px 0 0;font-weight:500;\">The functions that remain institutional require human accountability, legal enforceability and discretion — not temporary frictions waiting to be coded away. <span style=\"color:#0369a1;font-weight:700;\">IMF WP/26/136 · OECD No. 75<\u002Fspan><\u002Fp>\n  <\u002Fsection>\n\n  <!-- 5 · THREE-LEDGER PATH -->\n  <section data-label=\"Three-ledger path\" data-speaker-notes=\"The IMF taxonomy is a sequencing logic, not a menu of equal options.\" style=\"width:1080px;height:1350px;background:#f4f7fb;font-family:'Plus Jakarta Sans',sans-serif;color:#0f172a;padding:88px 84px;display:flex;flex-direction:column;position:relative;overflow:hidden;box-sizing:border-box;\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:56px;\">\n      <img src=\"fc179b3d-50f7-4d14-9504-bd3b697f2139\" alt=\"NextFi Advisors\" style=\"height:38px;\">\n      <span style=\"font-size:19px;font-weight:700;color:#94a3b8;letter-spacing:1px;\">05 / 14<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-size:22px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:#0369a1;margin-bottom:22px;\">The IMF Ledger Taxonomy<\u002Fdiv>\n    <h2 style=\"font-size:62px;line-height:1.05;font-weight:800;letter-spacing:-2px;margin:0 0 20px;color:#0a1f3d;text-wrap:balance;\">Not a menu. A migration path.<\u002Fh2>\n    <p style=\"font-size:23px;line-height:1.45;color:#64748b;margin:0 0 32px;font-weight:500;\">The IMF sorts tokenized platforms into three architectures. They aren't equal options — they are stages in how institutions adopt.<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:18px;flex:1;\">\n      <div style=\"background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:32px 38px;display:flex;align-items:center;gap:30px;\">\n        <div style=\"min-width:120px;\"><div style=\"font-size:30px;font-weight:800;color:#0a1f3d;\">Compatible<\u002Fdiv><div style=\"font-size:20px;font-weight:600;color:#0369a1;\">Today<\u002Fdiv><\u002Fdiv>\n        <div style=\"width:1px;align-self:stretch;background:#e2e8f0;\"><\u002Fdiv>\n        <p style=\"font-size:22px;line-height:1.38;color:#475569;margin:0;\">DLT for specific functions; settlement still coordinated off-chain. Lowest risk — <strong style=\"color:#0f172a;\">start here.<\u002Fstrong><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:center;color:#94a3b8;font-size:30px;\">↓<\u002Fdiv>\n      <div style=\"background:#ffffff;border:1px solid #cfe0ee;border-radius:16px;padding:32px 38px;display:flex;align-items:center;gap:30px;box-shadow:0 12px 30px rgba(3,105,161,0.08);\">\n        <div style=\"min-width:120px;\"><div style=\"font-size:30px;font-weight:800;color:#0a1f3d;\">Common<\u002Fdiv><div style=\"font-size:20px;font-weight:600;color:#0369a1;\">3–5 years<\u002Fdiv><\u002Fdiv>\n        <div style=\"width:1px;align-self:stretch;background:#e2e8f0;\"><\u002Fdiv>\n        <p style=\"font-size:22px;line-height:1.38;color:#475569;margin:0;\">Multiple ledgers linked by a shared interface, with shared governance. <strong style=\"color:#0f172a;\">The decision zone.<\u002Fstrong><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:center;color:#94a3b8;font-size:30px;\">↓<\u002Fdiv>\n      <div style=\"background:#0a1f3d;border-radius:16px;padding:32px 38px;display:flex;align-items:center;gap:30px;\">\n        <div style=\"min-width:120px;\"><div style=\"font-size:30px;font-weight:800;color:#ffffff;\">Single<\u002Fdiv><div style=\"font-size:20px;font-weight:600;color:#7dd3fc;\">Destination<\u002Fdiv><\u002Fdiv>\n        <div style=\"width:1px;align-self:stretch;background:rgba(255,255,255,0.15);\"><\u002Fdiv>\n        <p style=\"font-size:22px;line-height:1.38;color:#c9d8ea;margin:0;\">All assets &amp; participants on one shared ledger — atomic DvP, full automation. <strong style=\"color:#ffffff;\">The long-run target.<\u002Fstrong><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:21px;color:#64748b;margin:26px 0 0;font-weight:500;\">Jumping ledger types without the governance foundation is where programs fail most expensively.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- 6 · FIVE IMPERATIVES -->\n  <section data-label=\"Five imperatives\" data-speaker-notes=\"The five moves institutions should make now.\" style=\"width:1080px;height:1350px;background:#f4f7fb;font-family:'Plus Jakarta Sans',sans-serif;color:#0f172a;padding:88px 84px;display:flex;flex-direction:column;position:relative;overflow:hidden;box-sizing:border-box;\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:56px;\">\n      <img src=\"fc179b3d-50f7-4d14-9504-bd3b697f2139\" alt=\"NextFi Advisors\" style=\"height:38px;\">\n      <span style=\"font-size:19px;font-weight:700;color:#94a3b8;letter-spacing:1px;\">06 / 14<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-size:22px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:#0369a1;margin-bottom:22px;\">For Financial Institutions<\u002Fdiv>\n    <h2 style=\"font-size:62px;line-height:1.05;font-weight:800;letter-spacing:-2px;margin:0 0 48px;color:#0a1f3d;text-wrap:balance;\">Five strategic imperatives.<\u002Fh2>\n    <div style=\"display:flex;flex-direction:column;gap:22px;flex:1;\">\n      <div style=\"display:flex;gap:26px;align-items:center;\"><span style=\"min-width:60px;height:60px;background:#0369a1;color:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;\">1<\u002Fspan><p style=\"font-size:27px;line-height:1.32;color:#1e293b;margin:0;font-weight:600;\">Adopt the IMF ledger taxonomy as your sequencing framework<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:26px;align-items:center;\"><span style=\"min-width:60px;height:60px;background:#0369a1;color:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;\">2<\u002Fspan><p style=\"font-size:27px;line-height:1.32;color:#1e293b;margin:0;font-weight:600;\">Resolve the settlement asset decision before scaling distribution<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:26px;align-items:center;\"><span style=\"min-width:60px;height:60px;background:#0369a1;color:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;\">3<\u002Fspan><p style=\"font-size:27px;line-height:1.32;color:#1e293b;margin:0;font-weight:600;\">Treat governance design as a first-order architecture input<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:26px;align-items:center;\"><span style=\"min-width:60px;height:60px;background:#0369a1;color:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;\">4<\u002Fspan><p style=\"font-size:27px;line-height:1.32;color:#1e293b;margin:0;font-weight:600;\">Solve liquidity bootstrapping as a strategic challenge<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:26px;align-items:center;\"><span style=\"min-width:60px;height:60px;background:#0369a1;color:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;\">5<\u002Fspan><p style=\"font-size:27px;line-height:1.32;color:#1e293b;margin:0;font-weight:600;\">Align tokenization with the Convergence Economy thesis<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 7 · IMPERATIVE 1 -->\n  <section data-label=\"Imperative 1\" data-speaker-notes=\"Adopt the IMF ledger taxonomy as your sequencing framework — a sequencing logic, not a menu.\" style=\"width:1080px;height:1350px;background:#f4f7fb;font-family:'Plus Jakarta Sans',sans-serif;color:#0f172a;padding:88px 84px;display:flex;flex-direction:column;position:relative;overflow:hidden;box-sizing:border-box;\">\n    <div style=\"position:absolute;right:-30px;bottom:-120px;font-size:520px;font-weight:800;color:rgba(3,105,161,0.05);line-height:1;pointer-events:none;\">1<\u002Fdiv>\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:52px;position:relative;z-index:1;\">\n      <img src=\"fc179b3d-50f7-4d14-9504-bd3b697f2139\" alt=\"NextFi Advisors\" style=\"height:38px;\">\n      <span style=\"font-size:19px;font-weight:700;color:#94a3b8;letter-spacing:1px;\">07 / 14<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:20px;margin-bottom:26px;position:relative;z-index:1;\">\n      <span style=\"min-width:66px;height:66px;background:#0369a1;color:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;\">1<\u002Fspan>\n      <span style=\"font-size:20px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:#0369a1;\">Strategic Imperative · 1 of 5<\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-size:48px;line-height:1.08;font-weight:800;letter-spacing:-1.5px;margin:0 0 18px;color:#0a1f3d;text-wrap:balance;position:relative;z-index:1;\">Adopt the IMF ledger taxonomy as your sequencing framework.<\u002Fh2>\n    <p style=\"font-size:23px;line-height:1.45;color:#64748b;margin:0 0 30px;font-weight:500;position:relative;z-index:1;\">The three-ledger typology is a sequencing logic — each type a distinct stage of institutional maturity. Jumping stages is where programs fail most expensively.<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:15px;position:relative;z-index:1;\">\n      <div style=\"display:flex;gap:18px;align-items:flex-start;\"><span style=\"min-width:12px;height:12px;margin-top:10px;background:#38bdf8;border-radius:3px;\"><\u002Fspan><p style=\"font-size:25px;line-height:1.38;color:#334155;margin:0;\">A <strong style=\"color:#0f172a;\">sequencing logic, not a menu<\u002Fstrong> of equal options.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:18px;align-items:flex-start;\"><span style=\"min-width:12px;height:12px;margin-top:10px;background:#38bdf8;border-radius:3px;\"><\u002Fspan><p style=\"font-size:25px;line-height:1.38;color:#334155;margin:0;\">Most institutions already sit in <strong style=\"color:#0f172a;\">Compatible<\u002Fstrong> — often without a framework for what comes next.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:18px;align-items:flex-start;\"><span style=\"min-width:12px;height:12px;margin-top:10px;background:#38bdf8;border-radius:3px;\"><\u002Fspan><p style=\"font-size:25px;line-height:1.38;color:#334155;margin:0;\">Sequence <strong style=\"color:#0f172a;\">Compatible → Common<\u002Fstrong>; don't leap straight to Single.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:18px;align-items:flex-start;\"><span style=\"min-width:12px;height:12px;margin-top:10px;background:#38bdf8;border-radius:3px;\"><\u002Fspan><p style=\"font-size:25px;line-height:1.38;color:#334155;margin:0;\">Each stage adds efficiency — but demands more <strong style=\"color:#0f172a;\">governance &amp; legal maturity<\u002Fstrong>.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#eef4fb;border:1px solid #d6e4f0;border-radius:14px;padding:22px 26px;margin-top:26px;position:relative;z-index:1;\">\n      <div style=\"font-size:15px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#0369a1;margin-bottom:14px;\">The IMF three-ledger typology<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;\">\n        <p style=\"font-size:19px;line-height:1.35;color:#475569;margin:0;\"><strong style=\"color:#0f172a;\">Compatible ledger<\u002Fstrong> — DLT for specific functions; settlement stays off-chain. <span style=\"color:#94a3b8;\">(today)<\u002Fspan><\u002Fp>\n        <p style=\"font-size:19px;line-height:1.35;color:#475569;margin:0;\"><strong style=\"color:#0f172a;\">Common ledger<\u002Fstrong> — multiple ledgers joined by a shared interface &amp; governance. <span style=\"color:#94a3b8;\">(3–5 yrs)<\u002Fspan><\u002Fp>\n        <p style=\"font-size:19px;line-height:1.35;color:#475569;margin:0;\"><strong style=\"color:#0f172a;\">Single ledger<\u002Fstrong> — one shared ledger for all assets, balances &amp; participants; atomic DvP. <span style=\"color:#94a3b8;\">(destination)<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#0a1f3d;border-radius:16px;padding:28px 34px;margin-top:20px;position:relative;z-index:1;\">\n      <p style=\"font-size:24px;line-height:1.4;font-weight:700;color:#ffffff;margin:0;\">Assess where you sit today, name your target state, and sequence the path between — one ledger type at a time.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 8 · IMPERATIVE 2 -->\n  <section data-label=\"Imperative 2\" data-speaker-notes=\"Resolve the settlement asset decision before scaling distribution.\" style=\"width:1080px;height:1350px;background:#f4f7fb;font-family:'Plus Jakarta Sans',sans-serif;color:#0f172a;padding:88px 84px;display:flex;flex-direction:column;position:relative;overflow:hidden;box-sizing:border-box;\">\n    <div style=\"position:absolute;right:-30px;bottom:-120px;font-size:520px;font-weight:800;color:rgba(3,105,161,0.05);line-height:1;pointer-events:none;\">2<\u002Fdiv>\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:52px;position:relative;z-index:1;\">\n      <img src=\"fc179b3d-50f7-4d14-9504-bd3b697f2139\" alt=\"NextFi Advisors\" style=\"height:38px;\">\n      <span style=\"font-size:19px;font-weight:700;color:#94a3b8;letter-spacing:1px;\">08 / 14<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:20px;margin-bottom:26px;position:relative;z-index:1;\">\n      <span style=\"min-width:66px;height:66px;background:#0369a1;color:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;\">2<\u002Fspan>\n      <span style=\"font-size:20px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:#0369a1;\">Strategic Imperative · 2 of 5<\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-size:48px;line-height:1.08;font-weight:800;letter-spacing:-1.5px;margin:0 0 18px;color:#0a1f3d;text-wrap:balance;position:relative;z-index:1;\">Resolve the settlement asset decision before scaling distribution.<\u002Fh2>\n    <p style=\"font-size:23px;line-height:1.45;color:#64748b;margin:0 0 30px;font-weight:500;position:relative;z-index:1;\">Settlement asset selection is upstream of distribution. Untested assumptions are embedded risk that only becomes visible under stress.<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:15px;position:relative;z-index:1;\">\n      <div style=\"display:flex;gap:18px;align-items:flex-start;\"><span style=\"min-width:12px;height:12px;margin-top:10px;background:#38bdf8;border-radius:3px;\"><\u002Fspan><p style=\"font-size:24px;line-height:1.36;color:#334155;margin:0;\"><strong style=\"color:#0f172a;\">wCBDC<\u002Fstrong> — central bank money, no credit risk, but not operational at scale (2027–2028 at the earliest).<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:18px;align-items:flex-start;\"><span style=\"min-width:12px;height:12px;margin-top:10px;background:#38bdf8;border-radius:3px;\"><\u002Fspan><p style=\"font-size:24px;line-height:1.36;color:#334155;margin:0;\"><strong style=\"color:#0f172a;\">Tokenized deposits<\u002Fstrong> — the near-term bridge; carries issuing-bank credit and cross-border FX risk.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:18px;align-items:flex-start;\"><span style=\"min-width:12px;height:12px;margin-top:10px;background:#38bdf8;border-radius:3px;\"><\u002Fspan><p style=\"font-size:24px;line-height:1.36;color:#334155;margin:0;\"><strong style=\"color:#0f172a;\">Stablecoins<\u002Fstrong> — most accessible, but issuer credit and regulatory uncertainty; corridor-specific.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:18px;align-items:flex-start;\"><span style=\"min-width:12px;height:12px;margin-top:10px;background:#38bdf8;border-radius:3px;\"><\u002Fspan><p style=\"font-size:24px;line-height:1.36;color:#334155;margin:0;\">Stress-test for a <strong style=\"color:#0f172a;\">5-year wCBDC delay<\u002Fstrong> — and build wCBDC compatibility in now.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#eef4fb;border:1px solid #d6e4f0;border-radius:14px;padding:22px 26px;margin-top:26px;position:relative;z-index:1;\">\n      <div style=\"font-size:15px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#0369a1;margin-bottom:14px;\">Cross-border interoperability — a prerequisite<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;\">\n        <p style=\"font-size:19px;line-height:1.35;color:#475569;margin:0;\"><strong style=\"color:#0f172a;\">BIS Hub Project Meridian<\u002Fstrong> — cross-border wCBDC &amp; unified-ledger interoperability.<\u002Fp>\n        <p style=\"font-size:19px;line-height:1.35;color:#475569;margin:0;\"><strong style=\"color:#0f172a;\">SWIFT digital-asset connectivity<\u002Fstrong> — bridging traditional and DLT settlement.<\u002Fp>\n        <p style=\"font-size:19px;line-height:1.35;color:#475569;margin:0;\">Neither is finished — treat both as constraints, not assumed solutions.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#0a1f3d;border-radius:16px;padding:28px 34px;margin-top:20px;position:relative;z-index:1;\">\n      <p style=\"font-size:24px;line-height:1.4;font-weight:700;color:#ffffff;margin:0;\">Settle it early and explicitly — before pipelines are built and counterparties committed.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 9 · IMPERATIVE 3 -->\n  <section data-label=\"Imperative 3\" data-speaker-notes=\"Treat governance design as a first-order architecture input.\" style=\"width:1080px;height:1350px;background:#f4f7fb;font-family:'Plus Jakarta Sans',sans-serif;color:#0f172a;padding:88px 84px;display:flex;flex-direction:column;position:relative;overflow:hidden;box-sizing:border-box;\">\n    <div style=\"position:absolute;right:-30px;bottom:-120px;font-size:520px;font-weight:800;color:rgba(3,105,161,0.05);line-height:1;pointer-events:none;\">3<\u002Fdiv>\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:52px;position:relative;z-index:1;\">\n      <img src=\"fc179b3d-50f7-4d14-9504-bd3b697f2139\" alt=\"NextFi Advisors\" style=\"height:38px;\">\n      <span style=\"font-size:19px;font-weight:700;color:#94a3b8;letter-spacing:1px;\">09 / 14<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:20px;margin-bottom:26px;position:relative;z-index:1;\">\n      <span style=\"min-width:66px;height:66px;background:#0369a1;color:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;\">3<\u002Fspan>\n      <span style=\"font-size:20px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:#0369a1;\">Strategic Imperative · 3 of 5<\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-size:48px;line-height:1.08;font-weight:800;letter-spacing:-1.5px;margin:0 0 18px;color:#0a1f3d;text-wrap:balance;position:relative;z-index:1;\">Treat governance design as a first-order architecture input.<\u002Fh2>\n    <p style=\"font-size:23px;line-height:1.45;color:#64748b;margin:0 0 30px;font-weight:500;position:relative;z-index:1;\">The IMF calls governance and legal certainty irreducibly institutional; the OECD shows legal rights differ by jurisdiction. Governance is the foundation, not a later layer.<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:15px;position:relative;z-index:1;\">\n      <div style=\"display:flex;gap:18px;align-items:flex-start;\"><span style=\"min-width:12px;height:12px;margin-top:10px;background:#38bdf8;border-radius:3px;\"><\u002Fspan><p style=\"font-size:25px;line-height:1.38;color:#334155;margin:0;\">Governance requirements <strong style=\"color:#0f172a;\">escalate as ledger integration deepens<\u002Fstrong>.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:18px;align-items:flex-start;\"><span style=\"min-width:12px;height:12px;margin-top:10px;background:#38bdf8;border-radius:3px;\"><\u002Fspan><p style=\"font-size:25px;line-height:1.38;color:#334155;margin:0;\">Retrofitting governance costs an <strong style=\"color:#0f172a;\">order of magnitude more<\u002Fstrong> than designing it in.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:18px;align-items:flex-start;\"><span style=\"min-width:12px;height:12px;margin-top:10px;background:#38bdf8;border-radius:3px;\"><\u002Fspan><p style=\"font-size:25px;line-height:1.38;color:#334155;margin:0;\">Map rights &amp; custody <strong style=\"color:#0f172a;\">jurisdiction by jurisdiction<\u002Fstrong> — Luxembourg already diverges.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:18px;align-items:flex-start;\"><span style=\"min-width:12px;height:12px;margin-top:10px;background:#38bdf8;border-radius:3px;\"><\u002Fspan><p style=\"font-size:25px;line-height:1.38;color:#334155;margin:0;\">Extend model risk to <strong style=\"color:#0f172a;\">oracle, smart-contract and TWAP<\u002Fstrong> manipulation risks.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#eef4fb;border:1px solid #d6e4f0;border-radius:14px;padding:22px 26px;margin-top:26px;position:relative;z-index:1;\">\n      <div style=\"font-size:15px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#0369a1;margin-bottom:14px;\">Governance requirements by ledger level<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;\">\n        <p style=\"font-size:19px;line-height:1.35;color:#475569;margin:0;\"><strong style=\"color:#0f172a;\">Compatible<\u002Fstrong> — legal wrappers, custody obligations, investor rights.<\u002Fp>\n        <p style=\"font-size:19px;line-height:1.35;color:#475569;margin:0;\"><strong style=\"color:#0f172a;\">Common<\u002Fstrong> — shared default-fund rules, loss mutualization, dispute resolution.<\u002Fp>\n        <p style=\"font-size:19px;line-height:1.35;color:#475569;margin:0;\"><strong style=\"color:#0f172a;\">Single<\u002Fstrong> — protocol-level governance for automated liquidation &amp; finality.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#0a1f3d;border-radius:16px;padding:28px 34px;margin-top:20px;position:relative;z-index:1;\">\n      <p style=\"font-size:24px;line-height:1.4;font-weight:700;color:#ffffff;margin:0;\">Design governance in parallel with the technical build — never as a later review.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 10 · IMPERATIVE 4 -->\n  <section data-label=\"Imperative 4\" data-speaker-notes=\"Address liquidity bootstrapping as a strategic challenge.\" style=\"width:1080px;height:1350px;background:#f4f7fb;font-family:'Plus Jakarta Sans',sans-serif;color:#0f172a;padding:88px 84px;display:flex;flex-direction:column;position:relative;overflow:hidden;box-sizing:border-box;\">\n    <div style=\"position:absolute;right:-30px;bottom:-120px;font-size:520px;font-weight:800;color:rgba(3,105,161,0.05);line-height:1;pointer-events:none;\">4<\u002Fdiv>\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:52px;position:relative;z-index:1;\">\n      <img src=\"fc179b3d-50f7-4d14-9504-bd3b697f2139\" alt=\"NextFi Advisors\" style=\"height:38px;\">\n      <span style=\"font-size:19px;font-weight:700;color:#94a3b8;letter-spacing:1px;\">10 / 14<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:20px;margin-bottom:26px;position:relative;z-index:1;\">\n      <span style=\"min-width:66px;height:66px;background:#0369a1;color:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;\">4<\u002Fspan>\n      <span style=\"font-size:20px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:#0369a1;\">Strategic Imperative · 4 of 5<\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-size:48px;line-height:1.08;font-weight:800;letter-spacing:-1.5px;margin:0 0 18px;color:#0a1f3d;text-wrap:balance;position:relative;z-index:1;\">Address liquidity bootstrapping as a strategic challenge.<\u002Fh2>\n    <p style=\"font-size:23px;line-height:1.45;color:#64748b;margin:0 0 30px;font-weight:500;position:relative;z-index:1;\">Tokenized assets need critical mass before network effects activate — a coordination failure no product design solves on its own.<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:15px;position:relative;z-index:1;\">\n      <div style=\"display:flex;gap:18px;align-items:flex-start;\"><span style=\"min-width:12px;height:12px;margin-top:10px;background:#38bdf8;border-radius:3px;\"><\u002Fspan><p style=\"font-size:25px;line-height:1.38;color:#334155;margin:0;\">Waiting for standards to settle is <strong style=\"color:#0f172a;\">optionality-forfeiting<\u002Fstrong>, not risk management.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:18px;align-items:flex-start;\"><span style=\"min-width:12px;height:12px;margin-top:10px;background:#38bdf8;border-radius:3px;\"><\u002Fspan><p style=\"font-size:25px;line-height:1.38;color:#334155;margin:0;\">First-mover partnerships and ecosystem intelligence are <strong style=\"color:#0f172a;\">strategic assets<\u002Fstrong>.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:18px;align-items:flex-start;\"><span style=\"min-width:12px;height:12px;margin-top:10px;background:#38bdf8;border-radius:3px;\"><\u002Fspan><p style=\"font-size:25px;line-height:1.38;color:#334155;margin:0;\">A platform's value is the <strong style=\"color:#0f172a;\">network it can access on day one<\u002Fstrong>.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:18px;align-items:flex-start;\"><span style=\"min-width:12px;height:12px;margin-top:10px;background:#38bdf8;border-radius:3px;\"><\u002Fspan><p style=\"font-size:25px;line-height:1.38;color:#334155;margin:0;\">Network effects are competitive moats; the <strong style=\"color:#0f172a;\">first-mover window is narrow<\u002Fstrong>.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#eef4fb;border:1px solid #d6e4f0;border-radius:14px;padding:22px 26px;margin-top:26px;position:relative;z-index:1;\">\n      <div style=\"font-size:15px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#0369a1;margin-bottom:14px;\">Sources of day-one liquidity<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;\">\n        <p style=\"font-size:19px;line-height:1.35;color:#475569;margin:0;\"><strong style=\"color:#0f172a;\">Primary dealers<\u002Fstrong> — liquidity backstops for secondary instruments.<\u002Fp>\n        <p style=\"font-size:19px;line-height:1.35;color:#475569;margin:0;\"><strong style=\"color:#0f172a;\">Custodians<\u002Fstrong> — infrastructure plus investor-network access.<\u002Fp>\n        <p style=\"font-size:19px;line-height:1.35;color:#475569;margin:0;\"><strong style=\"color:#0f172a;\">Distribution partners<\u002Fstrong> — an existing base for the target instrument.<\u002Fp>\n        <p style=\"font-size:19px;line-height:1.35;color:#475569;margin:0;\"><strong style=\"color:#0f172a;\">Anchor investors<\u002Fstrong> — first-mover commitment structures.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#0a1f3d;border-radius:16px;padding:28px 34px;margin-top:20px;position:relative;z-index:1;\">\n      <p style=\"font-size:24px;line-height:1.4;font-weight:700;color:#ffffff;margin:0;\">Solve network formation deliberately — build the ecosystem before <span style=\"color:#7dd3fc;\">competitors do<\u002Fspan>.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 11 · IMPERATIVE 5 -->\n  <section data-label=\"Imperative 5\" data-speaker-notes=\"Align tokenization with the Convergence Economy thesis.\" style=\"width:1080px;height:1350px;background:#f4f7fb;font-family:'Plus Jakarta Sans',sans-serif;color:#0f172a;padding:88px 84px;display:flex;flex-direction:column;position:relative;overflow:hidden;box-sizing:border-box;\">\n    <div style=\"position:absolute;right:-30px;bottom:-120px;font-size:520px;font-weight:800;color:rgba(3,105,161,0.05);line-height:1;pointer-events:none;\">5<\u002Fdiv>\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:52px;position:relative;z-index:1;\">\n      <img src=\"fc179b3d-50f7-4d14-9504-bd3b697f2139\" alt=\"NextFi Advisors\" style=\"height:38px;\">\n      <span style=\"font-size:19px;font-weight:700;color:#94a3b8;letter-spacing:1px;\">11 / 14<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:20px;margin-bottom:26px;position:relative;z-index:1;\">\n      <span style=\"min-width:66px;height:66px;background:#0369a1;color:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;\">5<\u002Fspan>\n      <span style=\"font-size:20px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:#0369a1;\">Strategic Imperative · 5 of 5<\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-size:48px;line-height:1.08;font-weight:800;letter-spacing:-1.5px;margin:0 0 18px;color:#0a1f3d;text-wrap:balance;position:relative;z-index:1;\">Align tokenization with the Convergence Economy thesis.<\u002Fh2>\n    <p style=\"font-size:23px;line-height:1.45;color:#64748b;margin:0 0 30px;font-weight:500;position:relative;z-index:1;\">Two cost inputs — cognitive labor and transaction coordination — are compressing at once, generating structural surplus that is real, persistent and contested.<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:15px;position:relative;z-index:1;\">\n      <div style=\"display:flex;gap:18px;align-items:flex-start;\"><span style=\"min-width:12px;height:12px;margin-top:10px;background:#38bdf8;border-radius:3px;\"><\u002Fspan><p style=\"font-size:25px;line-height:1.38;color:#334155;margin:0;\">The IMF quantifies <strong style=\"color:#0f172a;\">transaction-coordination<\u002Fstrong> compression; AI compresses <strong style=\"color:#0f172a;\">cognitive labor<\u002Fstrong>.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:18px;align-items:flex-start;\"><span style=\"min-width:12px;height:12px;margin-top:10px;background:#38bdf8;border-radius:3px;\"><\u002Fspan><p style=\"font-size:25px;line-height:1.38;color:#334155;margin:0;\">Governance &amp; discretion remain the <strong style=\"color:#0f172a;\">non-substitutable human input<\u002Fstrong> in both.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:18px;align-items:flex-start;\"><span style=\"min-width:12px;height:12px;margin-top:10px;background:#38bdf8;border-radius:3px;\"><\u002Fspan><p style=\"font-size:25px;line-height:1.38;color:#334155;margin:0;\">A <strong style=\"color:#0f172a;\">standalone<\u002Fstrong> tokenization program extracts a fraction of the value.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:18px;align-items:flex-start;\"><span style=\"min-width:12px;height:12px;margin-top:10px;background:#38bdf8;border-radius:3px;\"><\u002Fspan><p style=\"font-size:25px;line-height:1.38;color:#334155;margin:0;\">The two vectors share the <strong style=\"color:#0f172a;\">same governance and legal foundations<\u002Fstrong>.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#eef4fb;border:1px solid #d6e4f0;border-radius:14px;padding:22px 26px;margin-top:26px;position:relative;z-index:1;\">\n      <div style=\"font-size:15px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#0369a1;margin-bottom:14px;\">The two cost-compression vectors<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;\">\n        <p style=\"font-size:19px;line-height:1.35;color:#475569;margin:0;\"><strong style=\"color:#0f172a;\">Transaction coordination<\u002Fstrong> — atomic DvP, collateral automation, on-chain default funds (IMF).<\u002Fp>\n        <p style=\"font-size:19px;line-height:1.35;color:#475569;margin:0;\"><strong style=\"color:#0f172a;\">Cognitive labor<\u002Fstrong> — AI-augmented workflows with human oversight at judgment points.<\u002Fp>\n        <p style=\"font-size:19px;line-height:1.35;color:#475569;margin:0;\">Governed together, the coordination advantage compounds across functions.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#0a1f3d;border-radius:16px;padding:28px 34px;margin-top:20px;position:relative;z-index:1;\">\n      <p style=\"font-size:24px;line-height:1.4;font-weight:700;color:#ffffff;margin:0;\">The surplus is largest for institutions that govern <span style=\"color:#7dd3fc;\">both vectors<\u002Fspan> together.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 12 · THE TENSION -->\n  <section data-label=\"Tension to watch\" data-speaker-notes=\"The wCBDC timeline risk is underpriced. Stress-test for a 5-year delay.\" style=\"width:1080px;height:1350px;background:radial-gradient(120% 80% at 85% 90%, #123255 0%, #0a1f3d 50%, #071627 100%);font-family:'Plus Jakarta Sans',sans-serif;color:#eaf1fb;padding:88px 84px;display:flex;flex-direction:column;position:relative;overflow:hidden;box-sizing:border-box;\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:56px;\">\n      <img src=\"f9631005-fd63-4af3-b703-8f71b995cd6a\" alt=\"NextFi Advisors\" style=\"height:38px;\">\n      <span style=\"font-size:19px;font-weight:700;color:#5f7796;letter-spacing:1px;\">12 / 14<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-size:22px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:#7dd3fc;margin-bottom:22px;\">The Tension to Watch<\u002Fdiv>\n    <h2 style=\"font-size:64px;line-height:1.04;font-weight:800;letter-spacing:-2px;margin:0 0 44px;color:#ffffff;text-wrap:balance;\">The wCBDC timeline risk is underpriced.<\u002Fh2>\n    <div style=\"display:flex;flex-direction:column;gap:32px;flex:1;justify-content:center;\">\n      <p style=\"font-size:32px;line-height:1.45;color:#dbe6f4;margin:0;\">Wholesale CBDC is <strong style=\"color:#ffffff;\">years from operational readiness at scale<\u002Fstrong> — plausibly 2027–2028 at the earliest, and likely later.<\u002Fp>\n      <p style=\"font-size:32px;line-height:1.45;color:#dbe6f4;margin:0;\">Tokenized deposits are the <strong style=\"color:#7dd3fc;\">bridge, not the destination<\u002Fstrong> — and that bridge carries credit and cross-border FX risk.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:rgba(125,211,252,0.1);border-left:6px solid #38bdf8;border-radius:0 14px 14px 0;padding:34px 40px;\">\n      <p style=\"font-size:28px;line-height:1.4;font-weight:700;color:#ffffff;margin:0;\">Stress-test your settlement asset strategy against a 5-year wCBDC delay.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 8 · BOTTOM LINE -->\n  <section data-label=\"Bottom line\" data-speaker-notes=\"Hybrid architecture is the durable endpoint. Move from experimentation to execution.\" style=\"width:1080px;height:1350px;background:radial-gradient(130% 90% at 20% 15%, #123255 0%, #0a1f3d 48%, #071627 100%);font-family:'Plus Jakarta Sans',sans-serif;color:#eaf1fb;padding:88px 84px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;box-sizing:border-box;\">\n    <img src=\"dc933662-fb97-4302-9b80-2f1c5f8697cb\" alt=\"\" style=\"position:absolute;left:-200px;top:-160px;width:640px;opacity:0.05;pointer-events:none;\">\n    <div style=\"position:absolute;top:88px;left:84px;right:84px;display:flex;align-items:center;justify-content:space-between;\">\n      <img src=\"f9631005-fd63-4af3-b703-8f71b995cd6a\" alt=\"NextFi Advisors\" style=\"height:38px;\">\n      <span style=\"font-size:19px;font-weight:700;color:#5f7796;letter-spacing:1px;\">13 / 14<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"position:relative;z-index:1;\">\n      <div style=\"width:64px;height:5px;background:#38bdf8;border-radius:3px;margin-bottom:36px;\"><\u002Fdiv>\n      <div style=\"font-size:22px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:#7dd3fc;margin-bottom:26px;\">The Bottom Line<\u002Fdiv>\n      <h2 style=\"font-size:72px;line-height:1.05;font-weight:800;letter-spacing:-2.5px;margin:0 0 40px;color:#ffffff;text-wrap:balance;\">Hybrid architecture is not a compromise. It is the durable endpoint.<\u002Fh2>\n      <p style=\"font-size:31px;line-height:1.5;color:#c9d8ea;margin:0;max-width:860px;\">The functions that stay institutional aren't temporary frictions waiting to be coded away. The next 12–18 months of design decisions determine who leads the transition — and who remediates later.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 9 · CTA -->\n  <section data-label=\"Read the brief\" data-speaker-notes=\"Call to action. Read the full brief; contact NextFi Advisors.\" style=\"width:1080px;height:1350px;background:radial-gradient(120% 90% at 82% 10%, #123255 0%, #0a1f3d 46%, #071627 100%);font-family:'Plus Jakarta Sans',sans-serif;color:#eaf1fb;padding:88px 84px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;box-sizing:border-box;\">\n    <img src=\"dc933662-fb97-4302-9b80-2f1c5f8697cb\" alt=\"\" style=\"position:absolute;right:-190px;bottom:-160px;width:700px;opacity:0.06;pointer-events:none;\">\n    <img src=\"f9631005-fd63-4af3-b703-8f71b995cd6a\" alt=\"NextFi Advisors\" style=\"height:50px;position:relative;z-index:1;\">\n    <div style=\"position:relative;z-index:1;\">\n      <div style=\"width:64px;height:5px;background:#38bdf8;border-radius:3px;margin-bottom:34px;\"><\u002Fdiv>\n      <h2 style=\"font-size:78px;line-height:1.02;font-weight:800;letter-spacing:-2.5px;margin:0 0 30px;color:#ffffff;\">Read the full brief.<\u002Fh2>\n      <p style=\"font-size:30px;line-height:1.45;color:#b6c9e2;margin:0 0 44px;max-width:800px;\">The complete synthesis — architecture guidance, sequencing risk, and the five imperatives in depth.<\u002Fp>\n      <div style=\"display:inline-flex;align-items:center;gap:16px;background:#38bdf8;color:#07223d;font-size:30px;font-weight:800;padding:24px 40px;border-radius:16px;\">intelligence.nextfiadvisors.com <span style=\"font-size:32px;\">→<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:relative;z-index:1;border-top:1px solid rgba(125,211,252,0.18);padding-top:28px;\">\n      <p style=\"font-size:21px;line-height:1.5;color:#8fa6c4;margin:0;font-weight:500;\">Sources: IMF Working Paper WP/26/136 &nbsp;·&nbsp; OECD Business and Finance Policy Papers No. 75<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
