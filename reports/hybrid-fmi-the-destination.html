document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

14361a\" alt=\"NextFi Advisors\" style=\"height:40px;\">\n        <span style=\"font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#7dd3fc;border:1px solid rgba(125,211,252,0.35);padding:7px 16px;border-radius:20px;\">Market Intelligence Brief · July 2026<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"width:56px;height:4px;background:#38bdf8;border-radius:3px;margin-bottom:22px;\"><\u002Fdiv>\n      <div style=\"font-size:14px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:#7dd3fc;margin-bottom:16px;\">Financial Markets Infrastructure<\u002Fdiv>\n      <h1 style=\"font-size:52px;line-height:1.03;font-weight:800;letter-spacing:-1.8px;margin:0 0 18px;color:#ffffff;max-width:900px;text-wrap:balance;\">Hybrid FMI Is the Destination<\u002Fh1>\n      <p style=\"font-size:20px;line-height:1.45;font-weight:500;color:#b6c9e2;max-width:820px;margin:0;\">What the IMF and OECD tell institutions about tokenization's real trajectory — and what it means for institutions still in experimentation mode.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1120px;margin:0 auto;padding:40px 40px 56px;\">\n\n    <!-- MAIN GRID -->\n    <div style=\"display:grid;grid-template-columns:1.15fr 0.85fr;gap:24px;margin-bottom:24px;\">\n\n      <div style=\"display:flex;flex-direction:column;gap:24px;\">\n        <section style=\"background:#ffffff;border:1px solid #e2e8f0;border-radius:14px;padding:28px 30px;box-shadow:0 10px 28px rgba(10,31,61,0.04);\">\n          <h2 style=\"font-size:13px;font-weight:700;color:#0369a1;text-transform:uppercase;letter-spacing:1px;margin:0 0 18px;padding-bottom:12px;border-bottom:1px solid #eef2f7;\">The Multilateral Consensus<\u002Fh2>\n          <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:13px;\">\n            <li style=\"position:relative;padding-left:24px;font-size:15px;line-height:1.5;color:#475569;\"><span style=\"position:absolute;left:0;top:7px;width:8px;height:8px;border-radius:50%;background:#0369a1;\"><\u002Fspan><strong style=\"color:#0f172a;\">Hybrid FMI is the structural outcome<\u002Fstrong> — not a transition, the durable endpoint.<\u002Fli>\n            <li style=\"position:relative;padding-left:24px;font-size:15px;line-height:1.5;color:#475569;\"><span style=\"position:absolute;left:0;top:7px;width:8px;height:8px;border-radius:50%;background:#0369a1;\"><\u002Fspan><strong style=\"color:#0f172a;\">Settlement asset interoperability<\u002Fstrong> is the critical near-term constraint.<\u002Fli>\n            <li style=\"position:relative;padding-left:24px;font-size:15px;line-height:1.5;color:#475569;\"><span style=\"position:absolute;left:0;top:7px;width:8px;height:8px;border-radius:50%;background:#0369a1;\"><\u002Fspan><strong style=\"color:#0f172a;\">Regulatory fragmentation<\u002Fstrong> is suppressing adoption more than technology readiness.<\u002Fli>\n          <\u002Ful>\n        <\u002Fsection>\n\n        <section style=\"background:#ffffff;border:1px solid #e2e8f0;border-radius:14px;padding:28px 30px;box-shadow:0 10px 28px rgba(10,31,61,0.04);\">\n          <h2 style=\"font-size:13px;font-weight:700;color:#0369a1;text-transform:uppercase;letter-spacing:1px;margin:0 0 18px;padding-bottom:12px;border-bottom:1px solid #eef2f7;\">The Three-Ledger Migration Path<\u002Fh2>\n          <table style=\"width:100%;border-collapse:collapse;font-size:12.5px;\">\n            <thead>\n              <tr>\n                <th style=\"background:#0a1f3d;color:#ffffff;font-weight:700;padding:11px 10px;text-align:left;border:1px solid #0a1f3d;font-size:11px;text-transform:uppercase;letter-spacing:0.4px;border-radius:8px 0 0 0;\">Dimension<\u002Fth>\n                <th style=\"background:#0a1f3d;color:#7dd3fc;font-weight:700;padding:11px 8px;text-align:center;border:1px solid #0a1f3d;font-size:11px;text-transform:uppercase;letter-spacing:0.4px;\">Compatible<br><span style=\"color:#8fa6c4;font-weight:600;\">Today<\u002Fspan><\u002Fth>\n                <th style=\"background:#0a1f3d;color:#7dd3fc;font-weight:700;padding:11px 8px;text-align:center;border:1px solid #0a1f3d;font-size:11px;text-transform:uppercase;letter-spacing:0.4px;\">Common<br><span style=\"color:#8fa6c4;font-weight:600;\">3–5 yrs<\u002Fspan><\u002Fth>\n                <th style=\"background:#0a1f3d;color:#7dd3fc;font-weight:700;padding:11px 8px;text-align:center;border:1px solid #0a1f3d;font-size:11px;text-transform:uppercase;letter-spacing:0.4px;border-radius:0 8px 0 0;\">Single Ledger<br><span style=\"color:#8fa6c4;font-weight:600;\">Destination<\u002Fspan><\u002Fth>\n              <\u002Ftr>\n            <\u002Fthead>\n            <tbody>\n              <tr>\n                <td style=\"padding:10px;border:1px solid #e2e8f0;background:#f8fafc;color:#0f172a;font-weight:600;\">Risk Profile<\u002Ftd>\n                <td style=\"padding:10px;border:1px solid #e2e8f0;color:#475569;text-align:center;\">Lowest risk<\u002Ftd>\n                <td style=\"padding:10px;border:1px solid #e2e8f0;color:#475569;text-align:center;\">Medium integration<\u002Ftd>\n                <td style=\"padding:10px;border:1px solid #e2e8f0;color:#475569;text-align:center;\">Full automation<\u002Ftd>\n              <\u002Ftr>\n              <tr>\n                <td style=\"padding:10px;border:1px solid #e2e8f0;background:#f8fafc;color:#0f172a;font-weight:600;\">Architecture<\u002Ftd>\n                <td style=\"padding:10px;border:1px solid #e2e8f0;color:#475569;text-align:center;\">Off-chain coordination<\u002Ftd>\n                <td style=\"padding:10px;border:1px solid #e2e8f0;color:#475569;text-align:center;\">Shared interfaces<\u002Ftd>\n                <td style=\"padding:10px;border:1px solid #e2e8f0;color:#475569;text-align:center;\">Atomic DvP<\u002Ftd>\n              <\u002Ftr>\n              <tr>\n                <td style=\"padding:10px;border:1px solid #e2e8f0;background:#f8fafc;color:#0f172a;font-weight:600;\">Efficiency Gain<\u002Ftd>\n                <td style=\"padding:10px;border:1px solid #e2e8f0;color:#475569;text-align:center;\">Limited<\u002Ftd>\n                <td style=\"padding:10px;border:1px solid #e2e8f0;color:#475569;text-align:center;\">Moderate<\u002Ftd>\n                <td style=\"padding:10px;border:1px solid #e2e8f0;color:#475569;text-align:center;\">Maximum<\u002Ftd>\n              <\u002Ftr>\n              <tr>\n                <td style=\"padding:10px;border:1px solid #e2e8f0;background:#f8fafc;color:#0f172a;font-weight:600;\">Governance<\u002Ftd>\n                <td style=\"padding:10px;border:1px solid #e2e8f0;color:#475569;text-align:center;\">Traditional<\u002Ftd>\n                <td style=\"padding:10px;border:1px solid #e2e8f0;color:#475569;text-align:center;\">Shared framework<\u002Ftd>\n                <td style=\"padding:10px;border:1px solid #e2e8f0;color:#475569;text-align:center;\">Legal maturity needed<\u002Ftd>\n              <\u002Ftr>\n            <\u002Ftbody>\n          <\u002Ftable>\n        <\u002Fsection>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:24px;\">\n        <section style=\"background:#ffffff;border:1px solid #e2e8f0;border-radius:14px;padding:28px 30px;box-shadow:0 10px 28px rgba(10,31,61,0.04);\">\n          <h2 style=\"font-size:13px;font-weight:700;color:#0369a1;text-transform:uppercase;letter-spacing:1px;margin:0 0 18px;padding-bottom:12px;border-bottom:1px solid #eef2f7;\">What Migrates On-Chain<\u002Fh2>\n          <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;\">\n            <li style=\"display:flex;align-items:center;gap:12px;font-size:15px;color:#1e293b;font-weight:500;\"><span style=\"color:#0f9d6a;font-weight:800;\">✓<\u002Fspan>Record-keeping<\u002Fli>\n            <li style=\"display:flex;align-items:center;gap:12px;font-size:15px;color:#1e293b;font-weight:500;\"><span style=\"color:#0f9d6a;font-weight:800;\">✓<\u002Fspan>Settlement finality<\u002Fli>\n            <li style=\"display:flex;align-items:center;gap:12px;font-size:15px;color:#1e293b;font-weight:500;\"><span style=\"color:#0f9d6a;font-weight:800;\">✓<\u002Fspan>Collateral management<\u002Fli>\n            <li style=\"display:flex;align-items:center;gap:12px;font-size:15px;color:#1e293b;font-weight:500;\"><span style=\"color:#0f9d6a;font-weight:800;\">✓<\u002Fspan>Reporting &amp; surveillance<\u002Fli>\n          <\u002Ful>\n        <\u002Fsection>\n\n        <section style=\"background:#0a1f3d;border:1px solid #0a1f3d;border-radius:14px;padding:28px 30px;box-shadow:0 10px 28px rgba(10,31,61,0.1);\">\n          <h2 style=\"font-size:13px;font-weight:700;color:#7dd3fc;text-transform:uppercase;letter-spacing:1px;margin:0 0 18px;padding-bottom:12px;border-bottom:1px solid rgba(125,211,252,0.18);\">What Remains Institutional<\u002Fh2>\n          <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;\">\n            <li style=\"display:flex;align-items:center;gap:12px;font-size:15px;color:#eaf1fb;font-weight:500;\"><span style=\"color:#7dd3fc;\">◆<\u002Fspan>Governance &amp; discretion<\u002Fli>\n            <li style=\"display:flex;align-items:center;gap:12px;font-size:15px;color:#eaf1fb;font-weight:500;\"><span style=\"color:#7dd3fc;\">◆<\u002Fspan>Legal enforceability<\u002Fli>\n            <li style=\"display:flex;align-items:center;gap:12px;font-size:15px;color:#eaf1fb;font-weight:500;\"><span style=\"color:#7dd3fc;\">◆<\u002Fspan>Systemic oversight<\u002Fli>\n          <\u002Ful>\n        <\u002Fsection>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n    <!-- IMPERATIVES -->\n    <section style=\"background:#ffffff;border:1px solid #e2e8f0;border-radius:14px;padding:28px 30px;box-shadow:0 10px 28px rgba(10,31,61,0.04);\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:6px;flex-wrap:wrap;\">\n        <h2 style=\"font-size:13px;font-weight:700;color:#0369a1;text-transform:uppercase;letter-spacing:1px;margin:0;\">Five Strategic Imperatives<\u002Fh2>\n        <sc-if value=\"{{ showHint }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:12px;color:#94a3b8;font-style:italic;\">Click any card to read the full imperative →<\u002Fspan><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"height:1px;background:#eef2f7;margin:12px 0 20px;\"><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:14px;\">\n        <div onclick=\"{{ open1 }}\" style=\"background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:18px 14px;cursor:pointer;transition:border-color .18s,background .18s,box-shadow .18s,transform .18s;\" style-hover=\"border-color:#0369a1;background:#eef6fc;box-shadow:0 10px 24px rgba(3,105,161,0.12);transform:translateY(-3px);\">\n          <div style=\"display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;background:#0369a1;color:#fff;font-weight:800;font-size:14px;border-radius:9px;margin-bottom:12px;\">1<\u002Fdiv>\n          <p style=\"font-size:13px;color:#334155;line-height:1.4;margin:0;font-weight:500;\">Adopt the IMF Ledger Taxonomy as your sequencing framework<\u002Fp>\n        <\u002Fdiv>\n        <div onclick=\"{{ open2 }}\" style=\"background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:18px 14px;cursor:pointer;transition:border-color .18s,background .18s,box-shadow .18s,transform .18s;\" style-hover=\"border-color:#0369a1;background:#eef6fc;box-shadow:0 10px 24px rgba(3,105,161,0.12);transform:translateY(-3px);\">\n          <div style=\"display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;background:#0369a1;color:#fff;font-weight:800;font-size:14px;border-radius:9px;margin-bottom:12px;\">2<\u002Fdiv>\n          <p style=\"font-size:13px;color:#334155;line-height:1.4;margin:0;font-weight:500;\">Resolve the settlement asset decision before scaling distribution<\u002Fp>\n        <\u002Fdiv>\n        <div onclick=\"{{ open3 }}\" style=\"background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:18px 14px;cursor:pointer;transition:border-color .18s,background .18s,box-shadow .18s,transform .18s;\" style-hover=\"border-color:#0369a1;background:#eef6fc;box-shadow:0 10px 24px rgba(3,105,161,0.12);transform:translateY(-3px);\">\n          <div style=\"display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;background:#0369a1;color:#fff;font-weight:800;font-size:14px;border-radius:9px;margin-bottom:12px;\">3<\u002Fdiv>\n          <p style=\"font-size:13px;color:#334155;line-height:1.4;margin:0;font-weight:500;\">Treat governance design as a first-order architecture input<\u002Fp>\n        <\u002Fdiv>\n        <div onclick=\"{{ open4 }}\" style=\"background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:18px 14px;cursor:pointer;transition:border-color .18s,background .18s,box-shadow .18s,transform .18s;\" style-hover=\"border-color:#0369a1;background:#eef6fc;box-shadow:0 10px 24px rgba(3,105,161,0.12);transform:translateY(-3px);\">\n          <div style=\"display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;background:#0369a1;color:#fff;font-weight:800;font-size:14px;border-radius:9px;margin-bottom:12px;\">4<\u002Fdiv>\n          <p style=\"font-size:13px;color:#334155;line-height:1.4;margin:0;font-weight:500;\">Address liquidity bootstrapping as a strategic challenge<\u002Fp>\n        <\u002Fdiv>\n        <div onclick=\"{{ open5 }}\" style=\"background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:18px 14px;cursor:pointer;transition:border-color .18s,background .18s,box-shadow .18s,transform .18s;\" style-hover=\"border-color:#0369a1;background:#eef6fc;box-shadow:0 10px 24px rgba(3,105,161,0.12);transform:translateY(-3px);\">\n          <div style=\"display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;background:#0369a1;color:#fff;font-weight:800;font-size:14px;border-radius:9px;margin-bottom:12px;\">5<\u002Fdiv>\n          <p style=\"font-size:13px;color:#334155;line-height:1.4;margin:0;font-weight:500;\">Align tokenization strategy with the Convergence Economy thesis<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- FOOTER -->\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:32px;padding-top:24px;border-top:1px solid #dbe3ec;\">\n      <img src=\"5fa37705-afe3-43af-b7af-5bffb0896397\" alt=\"NextFi Advisors\" style=\"height:30px;\">\n      <div style=\"text-align:right;\">\n        <p style=\"font-size:11px;color:#94a3b8;margin:0 0 4px;\">Sources: IMF Working Paper WP/26/136 &nbsp;|&nbsp; OECD Business and Finance Policy Papers No. 75<\u002Fp>\n        <p style=\"font-size:13px;color:#0369a1;font-weight:700;margin:0;\">nextfiadvisors.com<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <!-- MODAL -->\n  <div class=\"fmi-modal\" style=\"{{ overlayStyle }}\" onclick=\"{{ overlayClick }}\">\n    <div class=\"imp-dialog\" style=\"background:#ffffff;border-radius:16px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;position:relative;animation:fmiSlideUp .25s ease;box-shadow:0 30px 70px rgba(7,22,39,0.45);\" onclick=\"{{ stop }}\">\n      <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:26px 28px 18px;position:sticky;top:0;background:#0a1f3d;z-index:1;border-radius:16px 16px 0 0;\">\n        <div style=\"display:flex;align-items:flex-start;gap:14px;\">\n          <div style=\"display:flex;align-items:center;justify-content:center;width:34px;height:34px;min-width:34px;background:#38bdf8;color:#07223d;font-weight:800;font-size:15px;border-radius:10px;margin-top:2px;\">{{ badge }}<\u002Fdiv>\n          <div style=\"font-size:19px;font-weight:800;color:#ffffff;line-height:1.3;letter-spacing:-0.3px;\">{{ title }}<\u002Fdiv>\n        <\u002Fdiv>\n        <button onclick=\"{{ close }}\" style=\"background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);color:#c9d8ea;font-size:20px;line-height:1;width:32px;height:32px;min-width:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;\" style-hover=\"background:#f85149;border-color:#f85149;color:#fff;\">×<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"imp-body\" style=\"padding:24px 28px 28px;\">{{ bodyNode }}<\u002Fdiv>\n      <div style=\"padding:16px 28px 20px;border-top:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f8fafc;border-radius:0 0 16px 16px;position:sticky;bottom:0;\">\n        <span style=\"font-size:12px;color:#94a3b8;font-weight:500;\">{{ footerLabel }}<\u002Fspan>\n        <div style=\"display:flex;gap:8px;\">\n          <button onclick=\"{{ prev }}\" disabled=\"{{ prevDisabled }}\" style=\"{{ prevBtnStyle }}\" style-hover=\"border-color:#0369a1;color:#0369a1;\">← Prev<\u002Fbutton>\n          <button onclick=\"{{ next }}\" disabled=\"{{ nextDisabled }}\" style=\"{{ nextBtnStyle }}\" style-hover=\"border-color:#0369a1;color:#0369a1;\">Next →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1120,&quot;height&quot;:900},&quot;showHint&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Imperatives&quot;},&quot;keyboardNav&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Imperatives&quot;}}\">\nclass Component extends DCLogic {\n  state = { open: false, current: 1 };\n\n  imperatives = {\n    1: {\n      title: \"Adopt the IMF Ledger Taxonomy as Your Sequencing Framework\",\n      body: `\n        <h4>The Frame, Not Just the Label<\u002Fh4>\n        <p>The IMF's three-ledger typology — single ledger, common ledger, compatible ledger — is not a menu of equally valid alternatives. It is a sequencing logic. Each ledger type represents a distinct stage of institutional maturity and market readiness, and jumping stages without the prerequisite governance and legal foundations is where tokenization programs fail most expensively.<\u002Fp>\n        <h4>Compatible Ledger: The Right Starting Point, Not the Destination<\u002Fh4>\n        <p>Compatible ledger architectures are accessible today and defensible in current regulatory environments. They provide meaningful entry-point efficiency gains — reduced settlement latency, improved collateral visibility, DLT-enhanced record-keeping — without requiring wholesale institutional redesign or regulatory novelty. Most institutions are already operating in this zone without a clear framework for thinking about what comes next.<\u002Fp>\n        <ul>\n          <li>DLT for specific functions (e.g., issuance tracking, reporting) while maintaining off-chain settlement coordination<\u002Fli>\n          <li>Lowest implementation risk; highest coordination overhead relative to efficiency gain<\u002Fli>\n          <li>The zone where most institutions should anchor their near-term (0–2 year) tokenization programs<\u002Fli>\n        <\u002Ful>\n        <h4>Common Ledger: The Strategic Decision Zone<\u002Fh4>\n        <p>Common ledger architectures — including BIS Unified Ledger-style interfaces and interoperable CBDC frameworks — represent the medium-term convergence point. This is where the most consequential institutional decisions will be made over the next three to five years. Shared governance frameworks, interoperability agreements with counterparties, and tokenized deposit settlement infrastructure all converge here.<\u002Fp>\n        <ul>\n          <li>Requires shared interfaces and governance agreements with other platform participants<\u002Fli>\n          <li>Enables automated collateral substitution and margin call mechanics across participants<\u002Fli>\n          <li>First-mover disadvantage is real: institutions that wait for standards to fully settle forfeit the coordination advantage<\u002Fli>\n        <\u002Ful>\n        <h4>Single Ledger: The Long-Run Design Target<\u002Fh4>\n        <p>Single ledger platforms represent the full efficiency frontier — atomic DvP settlement, on-chain default fund prefunding, programmable corporate actions — but require legal framework maturity, governance alignment, and settlement asset availability that does not yet exist at scale in most jurisdictions. They are the right long-range architecture target for institutions that intend to operate in regulated markets at scale.<\u002Fp>\n        <div class=\"imp-callout\">NextFi's Operating Model Strategy engagements map current-state infrastructure against the ledger taxonomy and identify the minimum governance and legal investments required to advance — without forcing a premature leap to a ledger type the institution is not yet ready to operate.<\u002Fdiv>\n        <h4>Operational Implication<\u002Fh4>\n        <p>Assess where you sit in this taxonomy today. Identify your target state. Design a transition path — likely compatible → common, not compatible → single — that does not require jumping multiple ledger types simultaneously. The IMF framework validates this sequencing; NextFi operationalizes it.<\u002Fp>\n      `\n    },\n    2: {\n      title: \"Resolve the Settlement Asset Decision Before Scaling Distribution\",\n      body: `\n        <h4>The Decision Is Upstream of Everything Else<\u002Fh4>\n        <p>The OECD's impediment analysis makes an unambiguous point: settlement asset selection is upstream of distribution strategy. Institutions that have built tokenized asset distribution pipelines on settlement asset assumptions that have not been stress-tested against credit risk, liquidity conditions, and cross-border FX exposure are carrying embedded risk that is invisible in current market conditions and will become visible under stress.<\u002Fp>\n        <h4>Three Tiers, Three Distinct Risk Profiles<\u002Fh4>\n        <p>The market currently offers three settlement asset tiers — each with a different risk-return tradeoff that must be made explicit before distribution scales.<\u002Fp>\n        <ul>\n          <li><strong>Wholesale CBDC (wCBDC)<\u002Fstrong> — the long-run target. Central bank liability, no credit risk, no FX exposure in domestic transactions. Not yet operational at scale in any major jurisdiction; BIS Hub Project Meridian is the most advanced work, but full readiness is 2027–2028 at the earliest. Design for eventual migration now.<\u002Fli>\n          <li><strong>Tokenized deposits<\u002Fstrong> — the near-term practical bridge. Commercial bank money in tokenized form. Operational today in several jurisdictions. Carries the credit risk of the issuing bank and FX exposure in cross-border transactions. The right instrument for the interim, but not a permanent solution.<\u002Fli>\n          <li><strong>Stablecoins (stablecoin rails)<\u002Fstrong> — the most operationally accessible near-term option. Highly portable, cross-border capable, but carries issuer credit risk, regulatory uncertainty in multiple jurisdictions, and FX exposure that must be explicitly managed. Appropriate for specific corridors; not a universal settlement layer.<\u002Fli>\n        <\u002Ful>\n        <h4>The wCBDC Timeline Risk Is Underpriced<\u002Fh4>\n        <p>The OECD is cautious on wCBDC timelines — and rightly so. The record of central bank digital currency pilot programs globally suggests that full operational readiness at scale is plausibly 5+ years away in most jurisdictions, and could extend further where central bank mandates, legal frameworks, and technological infrastructure are misaligned. Institutions relying on wCBDC as the settlement asset for programs they are scaling today are building on a foundation that does not yet exist.<\u002Fp>\n        <ul>\n          <li>Stress-test your settlement asset strategy against a 5-year wCBDC delay scenario<\u002Fli>\n          <li>Ensure tokenized deposit arrangements include explicit provisions for credit risk, liquidity conditions, and cross-border FX exposure over an extended bridge period<\u002Fli>\n          <li>Design your architecture with wCBDC compatibility as a built-in migration path — not a future reconstruction<\u002Fli>\n        <\u002Ful>\n        <h4>Cross-Border Interoperability Is Not Optional<\u002Fh4>\n        <p>The OECD identifies the absence of cross-border CBDC interoperability as a prerequisite for global tokenized markets to be fully functional. BIS Hub Project Meridian and SWIFT's evolving digital asset connectivity strategy represent the two most relevant interoperability workstreams. Neither is finished; both must be treated as constraints on your near-term architecture, not as solutions you can assume will be available on your timeline.<\u002Fp>\n        <div class=\"imp-callout\">Institutions that resolve the settlement asset question late — after distribution pipelines are built and counterparties are committed — face the worst negotiating position. Settle it early, settle it explicitly, and build your architecture to absorb the transition when wCBDC becomes available.<\u002Fdiv>\n      `\n    },\n    3: {\n      title: \"Treat Governance Design as a First-Order Architecture Input\",\n      body: `\n        <h4>Governance Is Not a Layer — It Is the Foundation<\u002Fh4>\n        <p>The IMF's identification of governance and legal certainty as irreducibly institutional functions — combined with the OECD's documentation that legal rights adhere differently across jurisdictions — makes the case definitively: governance is not a layer added to tokenization architecture after the technology is built. It is a first-order input to the architecture itself. Smart contract logic that operates without a governing institutional framework is not a resilient FMI component. It is an operational risk that has not yet been triggered.<\u002Fp>\n        <h4>What \"Governance\" Means in This Context<\u002Fh4>\n        <p>The IMF's ledger taxonomy reveals that governance requirements escalate as ledger integration deepens. At the compatible ledger level, governance is largely traditional. At the common ledger level, governance must be shared and codified across multiple institutions with potentially conflicting incentive structures. At the single ledger level, governance must be baked into the protocol itself, with legal recognition of on-chain decisions across all participating jurisdictions.<\u002Fp>\n        <ul>\n          <li><strong>Compatible ledger:<\u002Fstrong> Legal wrappers for tokenized assets, custody obligations, investor rights across jurisdictions<\u002Fli>\n          <li><strong>Common ledger:<\u002Fstrong> Shared default fund rules, loss mutualization mechanics, dispute resolution, participant admission standards<\u002Fli>\n          <li><strong>Single ledger:<\u002Fstrong> Protocol-level governance for automated liquidation, on-chain default fund mechanics, atomic settlement finality enforcement<\u002Fli>\n        <\u002Ful>\n        <h4>The Retrofitting Cost Problem<\u002Fh4>\n        <p>The cost of retrofitting governance onto a deployed tokenization platform is an order of magnitude higher than designing it in from the outset. This is not an abstract concern — it is the most common failure mode in institutional tokenization programs that lead with technology and trail with governance. By the time governance gaps are discovered post-deployment, counterparties are committed, assets are issued, and the remediation cost includes legal renegotiation, smart contract migration, and potential regulatory notification.<\u002Fp>\n        <h4>The OECD's Jurisdiction Finding Is the Critical Alert<\u002Fh4>\n        <p>The OECD's observation that legal rights in tokenized assets may adhere differently depending on jurisdiction — specifically citing Luxembourg's divergence from the dominant record-holder model — is not a theoretical risk. It is an operational design constraint. Any institution distributing tokenized assets across jurisdictions must have a legal architecture that maps investor rights, custody obligations, and recovery mechanisms jurisdiction by jurisdiction, before the first investor is onboarded.<\u002Fp>\n        <div class=\"imp-callout\">In NextFi's Operating Model Strategy and Program Leadership engagements, governance frameworks, model risk controls, and legal wrappers are designed in parallel with technical architecture — not as a subsequent review. The brief's recommendation: audit whether your current tokenization program's governance design is running in parallel with the technical build, or trailing it.<\u002Fdiv>\n        <h4>Model Risk for Smart Contract Logic<\u002Fh4>\n        <p>The IMF flags a category of operational risks that are genuinely novel: oracle dependencies, smart contract logic errors, and TWAP manipulation in on-chain collateral valuation. These do not map cleanly onto existing model risk frameworks. Institutions deploying tokenization infrastructure without explicit model risk frameworks for smart contract logic are assuming risks their operational risk frameworks were not designed to capture.<\u002Fp>\n      `\n    },\n    4: {\n      title: \"Address the Liquidity Bootstrapping Problem as a Strategic Challenge\",\n      body: `\n        <h4>The Classic Coordination Failure<\u002Fh4>\n        <p>The OECD's identification of the liquidity bootstrapping problem is one of the most operationally consequential observations in either paper. Tokenized assets require critical mass of participants and volume before network effects activate — and that critical mass is difficult to achieve without institutional coordination, because rational individual actors wait for others to move first. This is not a product design problem. It is a market structure problem that requires a strategic response, not an operational one.<\u002Fp>\n        <h4>Why Waiting Is Not Risk Management<\u002Fh4>\n        <p>Waiting for standards to fully settle before entering tokenized asset markets is framed internally as risk management. It is, in fact, an optionality-forfeiting strategy. The institutions that solve the bootstrapping problem do so by committing early — building ecosystems, creating liquidity conditions that attract subsequent participants, and capturing the structural advantage of early network positioning before the market clears around a dominant platform.<\u002Fp>\n        <ul>\n          <li>First-mover institutional partnerships are strategic assets, not just operational relationships<\u002Fli>\n          <li>Ecosystem intelligence — knowing which custodians, primary dealers, and distribution networks can provide initial liquidity — is a differentiated capability<\u002Fli>\n          <li>The value of a tokenized asset platform is a function of the network it can access on day one, not the technical architecture alone<\u002Fli>\n        <\u002Ful>\n        <h4>What \"Solving Bootstrapping\" Looks Like Operationally<\u002Fh4>\n        <p>Institutions designing tokenized fund or RWA distribution strategies in isolation — without explicit first-mover partnerships — are building platforms whose value realization is contingent on a network formation problem they have not solved. The practical implication: for every tokenization program, there should be an explicit ecosystem strategy that runs parallel to the technical build, identifying the counterparties and liquidity providers whose participation on day one makes the platform self-sustaining.<\u002Fp>\n        <ul>\n          <li>Primary dealer relationships as initial liquidity backstops for tokenized secondary market instruments<\u002Fli>\n          <li>Custodian partnerships that provide both infrastructure and investor network access<\u002Fli>\n          <li>Distribution partnerships with platforms that already have the investor base the tokenized instrument targets<\u002Fli>\n          <li>Explicit first-mover commitment mechanisms (e.g., anchor investor structures in tokenized fund vehicles)<\u002Fli>\n        <\u002Ful>\n        <h4>Network Effects Are Competitive Moats<\u002Fh4>\n        <p>In tokenized asset markets, network effects compound faster than in traditional markets because on-chain settlement is global and operating hours are continuous. Once a platform achieves critical mass in a given instrument or asset class, the switching cost for participants is near-zero — they will move to the platform with the deepest liquidity. This means the window for achieving first-mover positioning in any given tokenized instrument category is narrower than most institutional planning cycles assume.<\u002Fp>\n        <div class=\"imp-callout\">NextFi's ecosystem intelligence and institutional relationship infrastructure exists to address this gap: identifying the counterparties, custodians, and distribution networks that can provide the initial liquidity conditions a new tokenized asset platform requires to become self-sustaining — before competitors do.<\u002Fdiv>\n      `\n    },\n    5: {\n      title: \"Align Tokenization Strategy with the Convergence Economy Thesis\",\n      body: `\n        <h4>The Same Dynamic, Two Cost Inputs<\u002Fh4>\n        <p>NextFi's Convergence Economy thesis holds that two cost inputs — cognitive labor and transaction coordination — are being compressed simultaneously, and that together they generate structural surplus that is real, persistent, and contested. The IMF's analysis of on-chain settlement, collateral automation, and reporting efficiency quantifies the transaction coordination side of that thesis with precision. The governance and discretion functions that remain institutional represent the point at which human judgment — increasingly augmented by AI — remains the non-substitutable input.<\u002Fp>\n        <h4>Where Tokenization and AI Converge<\u002Fh4>\n        <p>The IMF's argument that governance and discretion remain irreducibly institutional in tokenized FMI environments is structurally parallel to what NextFi observed in Multi-Agent Design Models for Financial Institutions: AI agent architectures can automate complex workflows while preserving human oversight at decision points that require judgment, legal accountability, or regulatory compliance. In both cases — AI-driven workflow automation and smart contract-driven settlement — technology compresses the operational cost of routine execution, but neither can substitute for institutional accountability at consequential decision points.<\u002Fp>\n        <ul>\n          <li>Programmable settlement + AI-augmented workflow automation = compound cost compression across both inputs<\u002Fli>\n          <li>The strategic surplus is largest for institutions that govern both vectors simultaneously<\u002Fli>\n          <li>The coordination advantage compounds across functions when both are governed together<\u002Fli>\n        <\u002Ful>\n        <h4>The Standalone Tokenization Program Is a Disadvantage<\u002Fh4>\n        <p>Institutions that treat tokenization as a standalone capital markets technology initiative — organized separately from AI strategy, run by a siloed team, evaluated on capital markets efficiency metrics alone — will extract a fraction of the value available to institutions that treat it as one dimension of a broader Convergence Economy positioning. The structural surplus is not maximized by deploying either technology in isolation. It compounds when both are governed together under a coherent institutional thesis.<\u002Fp>\n        <h4>The Institutional Positioning Implication<\u002Fh4>\n        <p>Tokenization strategy that is not explicitly connected to an institution's AI strategy is leaving value on the table. Conversely, AI strategy that does not account for programmable settlement infrastructure as a complementary cost compressor is incomplete. The most powerful institutional positioning in the next 3–5 years belongs to institutions that can design, govern, and operate both vectors simultaneously — because the governance frameworks, legal architecture, and institutional relationships required for each are largely shared.<\u002Fp>\n        <div class=\"imp-callout\">The institutions that will capture the structural surplus are those that recognize both cost compression vectors as parts of the same strategic thesis. The IMF provides the validation and the sequencing framework for the transaction coordination side. The AI governance framework provides the parallel logic for the cognitive labor side. Together they define the full scope of the opportunity.<\u002Fdiv>\n        <h4>What This Means for NextFi's Advisory Positioning<\u002Fh4>\n        <p>This imperative maps directly to NextFi's four-pillar advisory model: Digital Assets & Blockchain Advisory, AI / Agentic AI Governance, Technology Transformation, and Stablecoin Finance are not four separate service lines — they are four expressions of the same Convergence Economy thesis. Institutions that engage NextFi for one pillar increasingly find that the work connects to all four.<\u002Fp>\n      `\n    }\n  };\n\n  componentDidMount() {\n    this._onKey = (e) => {\n      if (!this.state.open) return;\n      if (this.props.keyboardNav === false) return;\n      if (e.key === 'Escape') this.close();\n      if (e.key === 'ArrowLeft') this.nav(-1);\n      if (e.key === 'ArrowRight') this.nav(1);\n    };\n    document.addEventListener('keydown', this._onKey);\n  }\n  componentWillUnmount() {\n    document.removeEventListener('keydown', this._onKey);\n    document.body.style.overflow = '';\n  }\n\n  open(n) {\n    this.setState({ open: true, current: n });\n    document.body.style.overflow = 'hidden';\n  }\n  close() {\n    this.setState({ open: false });\n    document.body.style.overflow = '';\n  }\n  nav(dir) {\n    const next = this.state.current + dir;\n    if (next < 1 || next > 5) return;\n    this.setState({ current: next });\n  }\n\n  renderVals() {\n    const n = this.state.current;\n    const imp = this.imperatives[n] || this.imperatives[1];\n    const btnBase = \"background:#ffffff;border:1px solid #cbd5e1;color:#475569;font-size:12px;font-weight:600;padding:7px 15px;border-radius:8px;cursor:pointer;transition:border-color .15s,color .15s;\";\n    const btnDisabled = \"background:#f1f5f9;border:1px solid #e2e8f0;color:#cbd5e1;font-size:12px;font-weight:600;padding:7px 15px;border-radius:8px;cursor:default;pointer-events:none;\";\n    return {\n      showHint: this.props.showHint !== false,\n      open1: () => this.open(1),\n      open2: () => this.open(2),\n      open3: () => this.open(3),\n      open4: () => this.open(4),\n      open5: () => this.open(5),\n      close: () => this.close(),\n      prev: () => this.nav(-1),\n      next: () => this.nav(1),\n      stop: (e) => e.stopPropagation(),\n      overlayClick: (e) => { if (e.target === e.currentTarget) this.close(); },\n      overlayStyle: \"position:fixed;inset:0;background:rgba(7,22,39,0.6);backdrop-filter:blur(3px);z-index:1000;padding:24px;display:\" + (this.state.open ? \"flex\" : \"none\") + \";align-items:center;justify-content:center;animation:fmiFade .18s ease;\",\n      badge: String(n),\n      title: imp.title,\n      bodyNode: React.createElement('div', { dangerouslySetInnerHTML: { __html: imp.body.trim() } }),\n      footerLabel: \"Imperative \" + n + \" of 5\",\n      prevDisabled: n === 1,\n      nextDisabled: n === 5,\n      prevBtnStyle: n === 1 ? btnDisabled : btnBase,\n      nextBtnStyle: n === 5 ? btnDisabled : btnBase\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
